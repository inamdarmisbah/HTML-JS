<html>
    <head>
        <script>
        
           function factorial(){
            let  facto= document.getElementById("fact").value;
            let fact=1;

            for( i=1;i<=facto;i++){
                fact*=i;
            }
            console.log(fact);
            document.getElementById("result").innerText= "factorial is = "+fact; 
           } 
        </script>
    </head>
    <body>
        <label>factorial</label>
        <input id="fact" type="text" />
        <br>
        <button onclick="factorial()">Submit</button>
        <br>
        <div id="result"></div>
    </body>
</html>
