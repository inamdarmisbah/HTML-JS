<html>

<head>
    <script>
        function evenOddArray() {
            let num = document.getElementById("EO").value;
            let array = num.split(',')
            let evenArray = [];
            let oddArray = [];

            for (let i = 0; i < array.length; i++) {
                console.log(array[i]);
                
               if(array[i]%2==0){
            evenArray.push(array[i]);
               }
               else{
                oddArray.push(array[i]);
               }
            }
            document.getElementById("resultEven").innerText = "Even Numbers" + evenArray;
            document.getElementById("resultOdd").innerText = "Odd Numbers" + oddArray;

        }
    </script>
</head>

<body>
    <label>Array</label>
    <input id="EO" type="text" />
    <button onclick="evenOddArray()">Submit</button>
    <div id="resultEven"></div>
    <div id="resultOdd"></div>
</body>
</body>

</html>
