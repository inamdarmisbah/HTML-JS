<html>

<head>
    <script>
        function submit() {
            let Marks = document.getElementById("Grade").value;
          if(Marks<=100 && Marks>=90)
          {
            // console.log("The Grade is A");
            document.getElementById("result").innerText= "grade is A"; 

          }
         else if(Marks<89 && Marks>=80)
           {
            // console.log("The Grade is B");
            document.getElementById("result").innerText="grade is B"; 

           }
        else if(Marks<79 && Marks>=70)
        {
            // console.log("The grade is c");
            document.getElementById("result").innerText="grade is C"; 

        }
        else if(Marks<69 && Marks>=60)
        {
            // console.log("The Grade is D");
            document.getElementById("result").innerText="grade is D"; 

        }
        else if(Marks<60 && Marks>0)
        {
            // console.log("Fail")
            document.getElementById("result").innerText="Fail"; 

        }
        else{
            document.getElementById("result").innerText="Invalid Input"; 

            // console.log("Invalid Input");
        }
   
        }
    </script>
</head>

<body>
    <label>Grades</label>
    <input id="Grade" type="text" />
    <button onclick="submit()">Submit</button>
    <div id="result"></div>
</body>

</html>
